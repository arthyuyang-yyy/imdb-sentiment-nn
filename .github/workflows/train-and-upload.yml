name: Train and Upload Model

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Upload artifacts to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: arthyuyang-ai/imdb-sentiment-nn
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          token = os.environ.get("HF_TOKEN")
          if not token:
              print("HF_TOKEN is not configured; skipping Hugging Face Hub upload.")
              raise SystemExit(0)

          from huggingface_hub import HfApi, upload_file

          repo_id = os.environ["HF_REPO_ID"]
          api = HfApi(token=token)

          api.create_repo(
              repo_id=repo_id,
              repo_type="model",
              private=False,
              exist_ok=True,
          )

          artifact_paths = [
              Path("metrics.json"),
              Path("model/config.json"),
              Path("model/metrics.json"),
          ]

          for path in artifact_paths:
              if not path.exists():
                  print(f"Skipping missing artifact: {path}")
                  continue

              upload_file(
                  path_or_fileobj=str(path),
                  path_in_repo=str(path),
                  repo_id=repo_id,
                  repo_type="model",
                  token=token,
              )
          PY
